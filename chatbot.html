<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farming Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f0f4f0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .chat-container {
            width: 90%;
            max-width: 800px;
            height: 80vh;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        .chat-header {
            padding: 20px;
            background: #4a7c59;
            color: white;
            display: flex;
            align-items: center;
        }
        
        .chat-header img {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            margin-right: 15px;
        }
        
        .chat-header h2 {
            font-weight: 500;
        }
        
        .chat-body {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            background-image: url('/api/placeholder/800/800');
            background-size: cover;
            background-position: center;
            background-blend-mode: overlay;
            background-color: rgba(255, 255, 255, 0.85);
        }
        
        .message {
            margin-bottom: 15px;
            max-width: 80%;
            padding: 12px 18px;
            border-radius: 18px;
            line-height: 1.4;
            position: relative;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .bot-message {
            background-color: #e9f5e9;
            border-bottom-left-radius: 5px;
            align-self: flex-start;
            margin-right: auto;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.05);
        }
        
        .user-message {
            background-color: #4a7c59;
            color: white;
            border-bottom-right-radius: 5px;
            align-self: flex-end;
            margin-left: auto;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }
        
        .message-container {
            display: flex;
            flex-direction: column;
        }
        
        .timestamp {
            font-size: 0.7rem;
            color: #999;
            margin-top: 5px;
            margin-left: 5px;
        }
        
        .chat-footer {
            padding: 15px 20px;
            border-top: 1px solid #eaeaea;
            display: flex;
            background: white;
        }
        
        .chat-input {
            flex: 1;
            border: none;
            padding: 12px 15px;
            border-radius: 30px;
            background: #f5f5f5;
            outline: none;
            font-size: 1rem;
        }
        
        .chat-input:focus {
            box-shadow: 0 0 0 2px rgba(74, 124, 89, 0.2);
        }
        
        .send-btn {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            background: #4a7c59;
            color: white;
            border: none;
            margin-left: 10px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s;
        }
        
        .send-btn:hover {
            background: #3d6649;
        }
        
        .send-btn:active {
            transform: scale(0.95);
        }
        
        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
            margin-bottom: 10px;
        }
        
        .suggestion-btn {
            padding: 8px 15px;
            background: white;
            border: 1px solid #4a7c59;
            border-radius: 20px;
            color: #4a7c59;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
        }
        
        .suggestion-btn:hover {
            background: #4a7c59;
            color: white;
        }
        
        .typing-indicator {
            padding: 12px 18px;
            background-color: #e9f5e9;
            border-radius: 18px;
            border-bottom-left-radius: 5px;
            display: none;
            align-items: center;
            margin-bottom: 15px;
            width: fit-content;
        }
        
        .typing-indicator span {
            height: 8px;
            width: 8px;
            background: #4a7c59;
            display: block;
            border-radius: 50%;
            margin: 0 2px;
            opacity: 0.4;
        }
        
        .typing-indicator span:nth-child(1) {
            animation: blink 1s infinite 0.1s;
        }
        
        .typing-indicator span:nth-child(2) {
            animation: blink 1s infinite 0.3s;
        }
        
        .typing-indicator span:nth-child(3) {
            animation: blink 1s infinite 0.5s;
        }
        
        @keyframes blink {
            50% { opacity: 1; }
        }
        
        @media (max-width: 768px) {
            .chat-container {
                width: 95%;
                height: 90vh;
            }
            
            .message {
                max-width: 90%;
            }
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <img src="./illustration-of-farmer-avatar-avatar-for-social-networks-vector.jpg" alt="Farming Assistant Logo">
            <h2>Farming Assistant</h2>
        </div>
        
        <div class="chat-body" id="chat-body">
            <div class="message-container">
                <div class="message bot-message">
                    Hello! I'm your Farming Assistant. I'm here to help you start your farming journey. What would you like to know about farming today?
                </div>
                <div class="timestamp">Today, 12:00 PM</div>
            </div>
            
            <div class="suggestions">
                <button class="suggestion-btn">Getting started</button>
                <button class="suggestion-btn">Soil preparation</button>
                <button class="suggestion-btn">Seasonal crops</button>
                <button class="suggestion-btn">Watering tips</button>
            </div>
            
            <div class="typing-indicator" id="typing-indicator">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
        
        <div class="chat-footer">
            <input type="text" class="chat-input" id="chat-input" placeholder="Type your question here..." autocomplete="off">
            <button class="send-btn" id="send-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const chatBody = document.getElementById('chat-body');
            const chatInput = document.getElementById('chat-input');
            const sendBtn = document.getElementById('send-btn');
            const typingIndicator = document.getElementById('typing-indicator');
            
            // Sample farming knowledge base for responses
            const farmingKnowledge = {
                'getting started': "To start farming, you'll need to: 1) Assess your land and resources, 2) Choose appropriate crops for your climate, 3) Prepare your soil with proper testing and amendments, 4) Gather basic tools like shovels, hoes, and watering equipment, and 5) Create a planting schedule. Would you like more details on any of these steps?",
                
                'soil preparation': "Good soil is the foundation of successful farming! Start by testing your soil's pH and nutrient levels. Most vegetables prefer a slightly acidic pH between 6.0-7.0. Add organic matter like compost to improve structure and fertility. Consider raised beds for better drainage if your soil is heavy clay. Would you like to know about natural soil amendments?",
                
                'seasonal crops': "Choosing seasonal crops increases your chances of success! Spring crops include lettuce, peas, and radishes. Summer brings tomatoes, peppers, and cucumbers. Fall is great for broccoli, carrots, and kale. Winter allows for garlic planting and some cold-hardy greens with protection. What season are you currently planning for?",
                
                'watering tips': "Proper watering is crucial for plant health! Water deeply but less frequently to encourage strong root growth. Morning watering is best to reduce evaporation and fungal issues. Consider drip irrigation or soaker hoses for efficiency. Mulch around plants to retain moisture. Most garden plants need about 1-1.5 inches of water weekly. Would you like specific watering advice for certain crops?",
                
                'pests': "For organic pest control, try companion planting (marigolds repel many insects), introduce beneficial insects like ladybugs, use neem oil for mild infestations, and practice crop rotation annually. Prevention is always better than treatment! Would you like to know about specific pest problems?",
                
                'fertilizer': "Organic fertilizers like compost, aged manure, bone meal, and fish emulsion provide balanced nutrients while building soil health. Chemical fertilizers work faster but don't improve soil structure. Always follow package directions to avoid over-fertilization which can damage plants and pollute waterways. What kinds of plants are you growing?",
                
                'tools': "Essential beginner farming tools include: garden fork and spade for soil preparation, hand trowel for planting, good quality pruners, durable garden hose or watering can, hoe for weeding, and quality gloves to protect your hands. As you expand, you might consider wheelbarrows and specialized tools.",
                
                'organic farming': "Organic farming emphasizes soil health through natural processes, avoiding synthetic fertilizers and pesticides. Key practices include crop rotation, green manuring, companion planting, biological pest control, and composting. Certification requires following specific standards for 3+ years. It's great for environmental sustainability and producing healthy food!",
                
                'default': "That's an interesting farming question! While I have knowledge on basic farming topics like soil preparation, seasonal planting, pest control, watering techniques, and organic methods, I'd recommend consulting local agricultural extension services for advice specific to your region. Local climate and soil conditions greatly affect farming success. Is there another farming topic I can help with?"
            };
            
            // Suggestions for different topics
            const suggestions = {
                'getting started': ['Soil preparation', 'Basic tools', 'When to plant', 'Easy beginner crops'],
                'soil preparation': ['Soil testing', 'Composting', 'Raised beds', 'Mulching'],
                'seasonal crops': ['Spring planting', 'Summer crops', 'Fall harvest', 'Winter growing'],
                'watering tips': ['Drip irrigation', 'Water conservation', 'Signs of overwatering', 'Drought-resistant plants'],
                'pests': ['Natural pest control', 'Common garden pests', 'Disease prevention', 'Beneficial insects'],
                'fertilizer': ['Organic options', 'Compost making', 'Fertilizing schedule', 'Signs of deficiency'],
                'tools': ['Essential tools', 'Tool maintenance', 'Budget options', 'Power vs. hand tools'],
                'organic farming': ['Certification process', 'Natural fertilizers', 'Companion planting', 'Crop rotation']
            };
            
            // Function to add message to chat
            function addMessage(message, isUser = false) {
                const messageContainer = document.createElement('div');
                messageContainer.className = 'message-container';
                
                const messageElement = document.createElement('div');
                messageElement.className = `message ${isUser ? 'user-message' : 'bot-message'}`;
                messageElement.textContent = message;
                
                const timestamp = document.createElement('div');
                timestamp.className = 'timestamp';
                
                // Get current time
                const now = new Date();
                let hours = now.getHours();
                const minutes = now.getMinutes().toString().padStart(2, '0');
                const ampm = hours >= 12 ? 'PM' : 'AM';
                hours = hours % 12;
                hours = hours ? hours : 12; // Convert 0 to 12
                
                timestamp.textContent = `Today, ${hours}:${minutes} ${ampm}`;
                
                messageContainer.appendChild(messageElement);
                messageContainer.appendChild(timestamp);
                
                chatBody.appendChild(messageContainer);
                
                // Scroll to bottom
                chatBody.scrollTop = chatBody.scrollHeight;
                
                return messageElement;
            }
            
            // Function to display typing indicator
            function showTypingIndicator() {
                typingIndicator.style.display = 'flex';
                chatBody.scrollTop = chatBody.scrollHeight;
            }
            
            // Function to hide typing indicator
            function hideTypingIndicator() {
                typingIndicator.style.display = 'none';
            }
            
            // Function to add suggestion buttons
            function addSuggestions(topic) {
                // Remove existing suggestions
                const existingSuggestions = document.querySelector('.suggestions');
                if (existingSuggestions) {
                    existingSuggestions.remove();
                }
                
                const suggestionsContainer = document.createElement('div');
                suggestionsContainer.className = 'suggestions';
                
                // Get relevant suggestions or default ones
                const topicSuggestions = suggestions[topic] || ['Getting started', 'Soil preparation', 'Seasonal crops', 'Watering tips'];
                
                topicSuggestions.forEach(suggestion => {
                    const button = document.createElement('button');
                    button.className = 'suggestion-btn';
                    button.textContent = suggestion;
                    button.addEventListener('click', () => {
                        handleUserMessage(suggestion);
                    });
                    suggestionsContainer.appendChild(button);
                });
                
                chatBody.appendChild(suggestionsContainer);
                chatBody.scrollTop = chatBody.scrollHeight;
            }
            
            // Function to process user message and generate response
            function processUserMessage(message) {
                const lowerMessage = message.toLowerCase();
                let responseTopic = 'default';
                let response = '';
                
                // Check for matches in our knowledge base
                for (const topic in farmingKnowledge) {
                    if (lowerMessage.includes(topic)) {
                        responseTopic = topic;
                        response = farmingKnowledge[topic];
                        break;
                    }
                }
                
                // Use default response if no match
                if (!response) {
                    response = farmingKnowledge.default;
                }
                
                return { response, topic: responseTopic };
            }
            
            // Function to handle user sending a message
            function handleUserMessage(message) {
                if (!message.trim()) return;
                
                // Add user message to chat
                addMessage(message, true);
                
                // Clear input
                chatInput.value = '';
                
                // Show typing indicator
                showTypingIndicator();
                
                // Simulate bot thinking and typing
                setTimeout(() => {
                    hideTypingIndicator();
                    
                    // Process message and get response
                    const { response, topic } = processUserMessage(message);
                    
                    // Add bot response
                    addMessage(response);
                    
                    // Add new suggestions based on the topic
                    addSuggestions(topic);
                    
                }, 1000 + Math.random() * 1000); // Random delay between 1-2 seconds
            }
            
            // Event listener for send button
            sendBtn.addEventListener('click', () => {
                handleUserMessage(chatInput.value);
            });
            
            // Event listener for Enter key
            chatInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    handleUserMessage(chatInput.value);
                }
            });
            
            // Event listeners for initial suggestion buttons
            document.querySelectorAll('.suggestion-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    handleUserMessage(btn.textContent);
                });
            });
        });
    </script>
</body>
</html>
