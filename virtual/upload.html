<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sell Your Product - Virtual Marketplace</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <div class="logo">Local Artisans</div>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="products.html">Shop</a></li>
        <li><a href="upload.html">Sell</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </nav>
  </header>

  <section class="upload-section">
    <h1>Upload Your Product</h1>
    <form action="/uploadProduct" method="POST" enctype="multipart/form-data" class="upload-form">
      <label for="productName">Product Name</label>
      <input type="text" id="productName" name="productName" required />

      <label for="description">Description</label>
      <textarea id="description" name="description" rows="4" required></textarea>

      <label for="price">Price (₹)</label>
      <input type="number" id="price" name="price" min="1" required />

      <label for="productImage">Product Image</label>
      <input type="file" id="productImage" name="productImage" accept="image/*" required />

      <button type="submit" class="btn">Upload Product</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2025 Virtual Marketplace | Crafted with ❤️</p>
  </footer>
</body>
</html>
